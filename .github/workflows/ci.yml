name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://aetheris:aetheris@localhost:5432/aetheris
      REDIS_URL: redis://localhost:6379
      AETHERIS_SECRET: ci-secret-with-at-least-32-characters-long
      AETHERIS_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients (postgres + sqlite)
        run: |
          npx prisma generate
          DATABASE_URL="file:./aetheris.db" npx prisma generate --schema prisma/sqlite/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Python backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q
