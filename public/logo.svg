<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon: Abstract "A" as cloud/server nodes -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal base representing enterprise nodes -->
    <path d="M40 5 L70 22 L70 58 L40 75 L10 58 L10 22 Z" 
          fill="none" 
          stroke="url(#iconGrad)" 
          stroke-width="3"
          filter="url(#glow)"/>
    
    <!-- Inner node connections -->
    <path d="M40 20 L55 30 L55 50 L40 60 L25 50 L25 30 Z" 
          fill="url(#iconGrad)" 
          opacity="0.15"/>
    
    <!-- Central "A" letterform -->
    <path d="M40 25 L55 55 L50 55 L47 48 L33 48 L30 55 L25 55 Z M35 44 L45 44 L40 32 Z" 
          fill="url(#emeraldGrad)"/>
    
    <!-- Node dots representing distributed systems -->
    <circle cx="40" cy="12" r="4" fill="#10B981"/>
    <circle cx="15" cy="28" r="3" fill="#10B981" opacity="0.7"/>
    <circle cx="65" cy="28" r="3" fill="#10B981" opacity="0.7"/>
    <circle cx="15" cy="52" r="3" fill="#10B981" opacity="0.7"/>
    <circle cx="65" cy="52" r="3" fill="#10B981" opacity="0.7"/>
    <circle cx="40" cy="68" r="4" fill="#10B981"/>
  </g>
  
  <!-- Wordmark -->
  <text x="95" y="62" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="48" 
        font-weight="700" 
        fill="#FAFAFA"
        letter-spacing="-1">Aetheris</text>
  
  <!-- Tagline -->
  <text x="95" y="82" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="12" 
        font-weight="500" 
        fill="#71717A"
        letter-spacing="3">ENTERPRISE PLATFORM</text>
</svg>